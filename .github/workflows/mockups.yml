name: Layout mockups

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  playwright:
    name: Playwright layout tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mockups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
